[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-bridge"
version = "0.1.0"
description = "Prompt ChatGPT (web session) for text and images via Playwright + backend-api hybrid"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.40",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chatgpt_bridge*"]

[tool.setuptools.package-data]
chatgpt_bridge = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]