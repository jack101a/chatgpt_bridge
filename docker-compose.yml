version: "3.8"

services:
  chatgpt-bridge:
    image: ghcr.io/jack101a/chatgpt_bridge:latest
    container_name: chatgpt-bridge
    restart: unless-stopped
    ports:
      - "${PORT:-8465}:8465"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Kolkata}
      - PORT=8465
      - HOST=0.0.0.0
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=720
      - MAX_RETRIES=10
      - BROWSER_IDLE_TIMEOUT_S=300
      - CHATGPT_BRIDGE_STATE=/data
      - MODE=${MODE:-bot}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:-*}
    volumes:
      - ${CONFIG_PATH:-/srv/ajaxhs/config}/chatgpt-bridge:/data
    shm_size: "1gb"
