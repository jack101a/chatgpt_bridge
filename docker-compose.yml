version: "3.8"

services:
  chatgpt-bridge:
    image: ghcr.io/jack101a/chatgpt-bridge-app:latest
    container_name: chatgpt-bridge
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # Shared Memory (CRITICAL for Chromium stability)
    # -------------------------------------------------------------------------
    # Docker's default /dev/shm is only 64MB. Chromium's multi-process
    # architecture uses shared memory to pass frame buffers between the Browser,
    # GPU/Viz, and Renderer processes. At 1280x720x32bit, a single uncompressed
    # frame is ~3.7MB; with double-buffering + canvas + image generation, usage
    # easily exceeds 200-400MB. Without this, Chromium crashes with SIGBUS.
    shm_size: "1gb"

    # -------------------------------------------------------------------------
    # Ports
    # -------------------------------------------------------------------------
    ports:
      - "${PORT:-8465}:8465"

    # -------------------------------------------------------------------------
    # Environment Variables
    # -------------------------------------------------------------------------
    environment:
      - PORT=8465
      - HOST=0.0.0.0
      - TZ=${TZ:-UTC}
      # Mode: 'api' (REST Gateway + Web Dashboard UI) or 'bot' (Telegram Bot)
      - MODE=${MODE:-api}
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=720
      - MAX_RETRIES=10
      # Seconds of idle before Chromium shuts down to free RAM (0 = never)
      - BROWSER_IDLE_TIMEOUT_S=300
      - CHATGPT_BRIDGE_STATE=/data
      # Max concurrent queued requests before 429 backpressure kicks in
      - CHATGPT_BRIDGE_MAX_QUEUED_CHATS=20
      - CHATGPT_BRIDGE_MAX_QUEUED_IMAGES=10
      # Telegram Bot (optional — leave empty for API-only mode)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:-*}
      # Optional: fallback OpenAI-compatible provider key
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

    # -------------------------------------------------------------------------
    # Volume Mounts (Persistent Data)
    # -------------------------------------------------------------------------
    volumes:
      # Named volume: managed by Docker, visible in Portainer UI
      - chatgpt_bridge_data:/data
      #
      # Alternative: host bind-mount (easier for local dev / manual cookie copy)
      # - ./chatgpt_bridge_data:/data

    # -------------------------------------------------------------------------
    # Resource Limits & Reservations (Prevent Host OOM)
    # -------------------------------------------------------------------------
    # Sized safely for 8GB RAM host systems:
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          cpus: "0.50"
          memory: 512M

    # -------------------------------------------------------------------------
    # Healthcheck (Portainer Status Badge)
    # -------------------------------------------------------------------------
    # Dual-mode healthcheck compatible with both API and Telegram bot modes:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8465/health 2>/dev/null || python -c \"import os,sys; sys.exit(0 if any('chatgpt_bridge' in open(f'/proc/{p}/cmdline','rb').read().decode('latin1','ignore') for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

# -----------------------------------------------------------------------------
# Named Volume Declaration
# -----------------------------------------------------------------------------
volumes:
  chatgpt_bridge_data:
    name: chatgpt_bridge_data
